name: SM-P900 source review regression
on:
  push:
    branches: [fix/sm-p900-review-20261110]
  pull_request:
    paths:
      - scripts/experimental_disable_wacom_lcd_sync_r15.py
      - scripts/audit_r15_wacom_boot_pair_readonly.py
      - tests/test_experimental_disable_wacom_lcd_sync_r15.py
      - tests/test_audit_r15_wacom_boot_pair_readonly.py
      - .github/workflows/sm-p900-review-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-image-validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ext4 fixture tools
        run: sudo apt-get update -qq && sudo apt-get install -y e2fsprogs binutils gcc
      - name: Run complete host regression suite
        run: python3 -m unittest discover -s tests -v
      - name: Verify exact upstream Wacom source and bounded transformation
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/salih4187/android_kernel_samsung_exynos5420/35d960ed3c2de3d5558b782257053599cded659e/drivers/input/wacom/wacom_i2c.c \
            -o "$RUNNER_TEMP/wacom_i2c.c"
          python3 - "$RUNNER_TEMP/wacom_i2c.c" <<'PY'
          import hashlib, sys
          from pathlib import Path
          from scripts import experimental_disable_wacom_lcd_sync_r15 as m
          data = Path(sys.argv[1]).read_bytes()
          assert hashlib.sha256(data).hexdigest() == m.EXPECTED_SOURCE_SHA256
          result, changed = m.transform(data.decode('utf-8'))
          assert changed
          assert result.replace(m.NEW, m.OLD, 1).encode('utf-8') == data
          assert m.transform(result) == (result, False)
          print('Pinned source verified; one-line transformation only. No hardware test.')
          PY
