name: Stock blob verifier tests
on:
  push:
    paths:
      - scripts/verify_stock_blobs.py
      - scripts/unpack_stock_system.py
      - tests/test_stock_blobs.py
      - tests/test_unpack_stock.py
      - tests/test_stock_staging.py
      - scripts/stage_stock_vendor.py
      - scripts/generate_vendor_rules.py
      - tests/test_stock_vendor_rules.py
      - scripts/stock_candidate_baseline.py
      - scripts/export_candidate_lists.py
      - tests/test_stock_candidates.py
      - rom/stock-candidate-overrides.json
      - .github/workflows/stock-blob-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install fixture tools
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs binutils gcc
      - name: Test generated ext4 fixtures (not hardware tests)
        run: python3 -m unittest discover -s tests -p 'test_*stock*.py' -v
