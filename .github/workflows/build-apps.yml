name: ELHARIKA apps and runner inventory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/**', 'scripts/build-apps-sdk.py', '.github/workflows/build-apps.yml']
permissions:
  contents: read
concurrency:
  group: elharika-apps-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Record actual resources
        run: |
          mkdir -p evidence
          df -h > evidence/disk.txt
          free -h > evidence/memory.txt
          nproc > evidence/cpu.txt
      - name: Install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/elharika-sdk"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/platform-30_r03.zip -o "$RUNNER_TEMP/platform.zip"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/build-tools_r30.0.3-linux.zip -o "$RUNNER_TEMP/build-tools.zip"
          unzip -q "$RUNNER_TEMP/platform.zip" -d "$RUNNER_TEMP/elharika-sdk/platform"
          unzip -q "$RUNNER_TEMP/build-tools.zip" -d "$RUNNER_TEMP/elharika-sdk/tools"
          sha256sum "$RUNNER_TEMP/platform.zip" "$RUNNER_TEMP/build-tools.zip" > evidence/sdk-checksums.txt
      - name: Build development APKs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-apps-sdk.py \
            --android-jar "$RUNNER_TEMP/elharika-sdk/platform/android-11/android.jar" \
            --build-tools "$RUNNER_TEMP/elharika-sdk/tools/android-11" \
            --keystore "$RUNNER_TEMP/elharika-debug.jks" 2>&1 | tee evidence/build.log
          sha256sum out/pen/pen-debug.apk out/launcher/launcher-debug.apk > evidence/SHA256SUMS
      - name: Save build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elharika-build-evidence
          path: evidence/
          retention-days: 7
      - name: Save successful development APKs
        uses: actions/upload-artifact@v4
        with:
          name: elharika-development-apks-not-rom
          path: |
            out/pen/pen-debug.apk
            out/launcher/launcher-debug.apk
          if-no-files-found: error
          retention-days: 7

