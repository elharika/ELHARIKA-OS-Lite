name: Trigger SM-P900 system image build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-system-image-build.yml'
      - 'ci/release-system-build-queue.txt'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-system-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch latest system image workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            repos/${{ github.repository }}/actions/workflows/android11-systemimage-after-boot.yml/dispatches \
            -f ref=main
