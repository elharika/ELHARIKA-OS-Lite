name: Trigger SM-P900 system image build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-system-image-build.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-system-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Cancel stale builds and dispatch latest system image workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run_id in 40928418632 40928549226; do
            gh api --method POST \
              repos/${{ github.repository }}/actions/runs/${run_id}/cancel || true
          done
          gh api --method POST \
            repos/${{ github.repository }}/actions/workflows/android11-systemimage-after-boot.yml/dispatches \
            -f ref=main
