name: Release SM-P900 system build queue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-system-image-build.yml'
      - 'ci/release-system-build-queue.txt'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  release-system-build-queue:
    runs-on: ubuntu-22.04
    steps:
      - name: Force-cancel stale system build holding the concurrency group
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            repos/${{ github.repository }}/actions/runs/40928326941/force-cancel || true
