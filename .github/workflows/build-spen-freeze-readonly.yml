name: SM-P900 S Pen drawing freeze TWRP read-only diagnostic
on:
  push:
    branches: [diagnostics/spen-drawing-freeze-20261108]
    paths:
      - .github/workflows/build-spen-freeze-readonly.yml
      - diagnostics/twrp-spen-freeze-readonly.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack-postfreeze-collector:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate no-touch installer and ZIP
        shell: bash
        run: |
          set -euo pipefail
          sh -n diagnostics/twrp-spen-freeze-readonly.sh
          python3 - <<'PY'
          import pathlib,hashlib,zipfile
          src=pathlib.Path('diagnostics/twrp-spen-freeze-readonly.sh').read_bytes()
          text=src.decode('utf-8')
          commands='\n'.join(s for s in text.splitlines() if not s.lstrip().startswith('#'))
          assert 'getprop ro.product.device' in text and 'P900' in text
          for marker in ('/proc/last_kmsg','/sys/fs/pstore/','/data/system/dropbox','/data/anr','/data/tombstones','ELHARIKA-SPEN-FREEZE-'):
              assert marker in text,marker
          forbidden=('dd if=','dd of=','mkfs','mke2fs','flash_image','blockdev --','mount -t','remount','setprop ','rm -rf /data','rm -rf /system','/dev/block/')
          for token in forbidden: assert token not in commands,token
          assert 'sha256sum "$BASE.tgz"' in text
          assert 'rm -rf -- "$BASE"' in text
          out=pathlib.Path('dist')
          out.mkdir(exist_ok=True)
          target=out/'ELHARIKA-SM-P900-SPEN-FREEZE-READONLY-COLLECTOR.zip'
          with zipfile.ZipFile(target,'w',zipfile.ZIP_STORED) as z:
              for name,blob,mode in (
                  ('META-INF/com/google/android/update-binary',src,0o100755),
                  ('META-INF/com/google/android/updater-script',b'# Read-only crash report, no flash.\n',0o100644),
                  ('README.txt',b'SM-P900 S Pen freeze postmortem. In TWRP Mount enable Data and Micro SDCard. Install this INNER diagnostic ZIP; find ELHARIKA-SPEN-FREEZE-xx.tgz on microSD. No Android OS changes. Logs can contain private data.\n',0o100644)):
                  info=zipfile.ZipInfo(name,(2026,11,8,0,0,0))
                  info.create_system=3
                  info.external_attr=mode<<16
                  z.writestr(info,blob)
          with zipfile.ZipFile(target) as z:
              assert z.testzip() is None
              assert len(z.namelist())==3
              assert z.read('META-INF/com/google/android/update-binary')==src
              assert z.getinfo('META-INF/com/google/android/update-binary').external_attr>>16 & 0o111
          digest=hashlib.sha256(target.read_bytes()).hexdigest()
          (out/'SHA256SUMS.txt').write_text(digest+'  '+target.name+'\n')
          print('READ ONLY ZIP',target,'size',target.stat().st_size,'sha256',digest)
          PY
          (cd dist && sha256sum --check SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ELHARIKA-SM-P900-SPEN-FREEZE-READONLY-DIAGNOSTICS
          path: dist/
          if-no-files-found: error
          retention-days: 30
