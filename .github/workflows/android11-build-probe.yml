name: Android 11 SM-P900 build probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android11-build-probe
  cancel-in-progress: false
jobs:
  bootimage-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate all project tools before downloading Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -m unittest discover -s tests -v 2>&1 | tee evidence/project-tests.log
          python3 -m compileall -q scripts tests
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Reclaim hosted runner disk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          df -B1 > evidence/disk-before-cleanup.txt
          for tool_path in /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /opt/ghc /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/Go /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/Java_Temurin; do
            if [ -L "$tool_path" ]; then
              echo "Unexpected symlink: $tool_path" >&2
              exit 1
            fi
            if [ -d "$tool_path" ]; then
              sudo du -sx -B1 "$tool_path" >> evidence/removed-tools-sizes.txt
              sudo rm -rf --one-file-system -- "$tool_path"
            fi
          done
          /usr/bin/python3 --version
          git --version
          df -B1 > evidence/disk-after-cleanup.txt
      - name: Prepare verified SM-P900 vendor inputs before source sync
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_stock_download.py -v
          sudo apt-get update -qq
          sudo apt-get install -y e2fsprogs binutils bc lzop libncurses5 patchelf
          stock_work="$RUNNER_TEMP/elharika-stock-input"
          mkdir -p "$stock_work"
          python3 scripts/download_stock_input.py 1DbRfFvu2W2RNuclR_zKXhAfKxNEX5Jg6 "$stock_work/stock.zip"
          python3 scripts/unpack_stock_system.py "$stock_work/stock.zip" "$stock_work/expanded"
          python3 scripts/minimal_vendor_baseline.py reports/stock-P900XXS0BPL4-vendor-comparison.json "$stock_work/minimal.json"
          python3 scripts/stock_candidate_baseline.py "$stock_work/minimal.json" "$stock_work/candidates.json"
          python3 scripts/stage_stock_vendor.py --system-image "$stock_work/expanded/system.ext4" --baseline "$stock_work/candidates.json" --output "$stock_work/stage"
          python3 scripts/assemble_vendor_tree.py "$stock_work/candidates.json" "$stock_work/stage" "$RUNNER_TEMP/elharika-vendor"
          (cd "$RUNNER_TEMP/elharika-vendor" && sha256sum --check --quiet SHA256SUMS)
          cp "$RUNNER_TEMP/elharika-vendor/assembly-report.json" evidence/vendor-assembly.json
          cp "$RUNNER_TEMP/elharika-vendor/SHA256SUMS" evidence/vendor-source-sha256.txt
          python3 - "$RUNNER_TEMP/elharika-vendor/samsung/v1awifi/proprietary/vendor/lib/sensors.universal5420.so" <<'PY'
          import hashlib, json, re, sys
          from pathlib import Path
          data = Path(sys.argv[1]).read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          if digest != "4e7ab23e9fe49e2650c3f52a17f3d7433b76c4c89733b02d9a7e5dcc742db848":
              raise SystemExit("Unreviewed stock sensor library")
          candidates = sorted({s.decode("ascii") for s in re.findall(rb"[ -~]{4,}", data)
                               if re.search(rb"/sys/|/dev/|poll_delay|enable|input|calibration", s, re.I)})
          Path("evidence/sensor-static-path-hints.json").write_text(json.dumps(
              {"sha256": digest, "status": "STATIC_HINTS_NOT_OBSERVED_RUNTIME_ACCESSES",
               "strings": candidates}, indent=2) + "\n")
          PY
          # Remove only this job's verified, reproducible extraction intermediates.
          rm -rf -- "$stock_work"
      - name: Initialize and sync Android 11 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android11" "$GITHUB_WORKSPACE/evidence"
          git clone --depth=1 https://gerrit.googlesource.com/git-repo "$RUNNER_TEMP/repo-tool"
          cd "$RUNNER_TEMP/android11"
          python3 "$RUNNER_TEMP/repo-tool/repo" init \
            -u https://github.com/LineageOS/android \
            -b 88e370827501474db8f1905128fdea2e8128ead4 \
            --depth=1 --no-clone-bundle \
            --repo-url=https://gerrit.googlesource.com/git-repo --repo-rev=stable
          python3 "$RUNNER_TEMP/repo-tool/repo" manifest -o "$GITHUB_WORKSPACE/evidence/base-manifest.xml"
          mkdir -p .repo/local_manifests
          python3 "$GITHUB_WORKSPACE/scripts/prepare_sync_manifest.py" \
            "$GITHUB_WORKSPACE/evidence/base-manifest.xml" \
            "$GITHUB_WORKSPACE/rom/roomservice.xml" .repo/local_manifests/elharika.xml
          cp .repo/local_manifests/elharika.xml "$GITHUB_WORKSPACE/evidence/hardware-overlay.xml"
          python3 "$RUNNER_TEMP/repo-tool/repo" sync -c -j4 \
            --no-clone-bundle --no-tags --optimized-fetch --fail-fast \
            2>&1 | tee "$GITHUB_WORKSPACE/evidence/sync.log"
          python3 "$RUNNER_TEMP/repo-tool/repo" manifest -r -o "$GITHUB_WORKSPACE/evidence/platform-lock.xml"
          test "$(git -C vendor/apn rev-parse HEAD)" = cfcbd9d61d6c22e5b60b2f10274d6cd1ff460f5e
          bash -n vendor/apn/make-apns.sh
          du -sh . > "$GITHUB_WORKSPACE/evidence/source-size.txt"
          df -B1 > "$GITHUB_WORKSPACE/evidence/disk-after-sync.txt"
      - name: Integrate exact-model vendor tree and custom product
        shell: bash
        run: |
          set -euo pipefail
          android_root="$RUNNER_TEMP/android11"
          mkdir -p "$android_root/vendor/samsung"
          for device in universal5420-common v1a-common v1awifi; do
            test ! -e "$android_root/vendor/samsung/$device"
            test -f "$RUNNER_TEMP/elharika-vendor/samsung/$device/$device-vendor.mk"
          done
          for device in universal5420-common v1a-common v1awifi; do
            mv "$RUNNER_TEMP/elharika-vendor/samsung/$device" "$android_root/vendor/samsung/"
          done
          python3 scripts/apply_device_fixes.py "$android_root/device/samsung/universal5420-common"
          python3 scripts/apply_minimal_profile.py "$android_root/device/samsung/universal5420-common"
          python3 scripts/prepare_product.py "$android_root"
          python3 scripts/harden_sepolicy.py "$android_root/device/samsung/universal5420-common"
          python3 scripts/fix_wifi_policy.py "$android_root/device/samsung/universal5420-common"
          python3 scripts/fix_touch_policy.py "$android_root/device/samsung/universal5420-common"
          python3 scripts/fix_graphics_policy.py "$android_root/device/samsung/universal5420-common"
          python3 scripts/fix_init_policy.py "$android_root/device/samsung/universal5420-common"
          python3 scripts/fix_camera_hosting.py "$android_root/device/samsung/universal5420-common"
          python3 scripts/fix_modem_policy.py "$android_root/device/samsung/universal5420-common"
          python3 scripts/fix_sensor_policy.py "$android_root/device/samsung/universal5420-common"
          python3 scripts/fix_core_data_labels.py "$android_root/device/samsung/universal5420-common"
      - name: Validate SM-P900 lunch target
        shell: bash
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/android11"
          set +u
          source build/envsetup.sh
          lunch elharika_v1awifi-userdebug 2>&1 | tee "$GITHUB_WORKSPACE/evidence/lunch.log"
          env | grep -E '^(TARGET_PRODUCT|TARGET_BUILD_VARIANT|TARGET_DEVICE)=' | sort > "$GITHUB_WORKSPACE/evidence/target-env.txt" || true
      - name: Compile SELinux policy before expensive system build
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/android11"
          python3 "$GITHUB_WORKSPACE/scripts/bounded_build.py" \
            --root "$RUNNER_TEMP/android11" \
            --evidence "$GITHUB_WORKSPACE/evidence/selinux" \
            --minutes 18 --reserve-gib 8 -- \
            bash -lc 'set +u; source build/envsetup.sh && lunch elharika_v1awifi-userdebug >/dev/null && m -j2 sepolicy_neverallows sepolicy_tests'
      - name: Probe boot and system image compilation within disk/time limits
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/android11"
          # Load Android only inside the monitored shell; envsetup expects unset variables.
          python3 "$GITHUB_WORKSPACE/scripts/bounded_build.py" \
            --root "$RUNNER_TEMP/android11" \
            --evidence "$GITHUB_WORKSPACE/evidence" \
            --minutes 135 --reserve-gib 6 -- \
            bash -lc 'set +u; source build/envsetup.sh && lunch elharika_v1awifi-userdebug >/dev/null && m -j2 bootimage systemimage'
      - name: Verify actual boot image contents
        shell: bash
        run: |
          set -euo pipefail
          product="$RUNNER_TEMP/android11/out/target/product/v1awifi"
          python3 scripts/verify_boot_image.py "$product" evidence/boot-image-validation.json
          mkdir -p development-boot
          cp "$product/boot.img" development-boot/
          (cd development-boot && sha256sum boot.img > SHA256SUMS)
          cp evidence/boot-image-validation.json development-boot/
          echo "Development boot image only. Not a ROM. Hardware untested; not approved for flashing." > development-boot/README.txt
      - name: Verify produced system image bounds
        shell: bash
        run: |
          set -euo pipefail
          product="$RUNNER_TEMP/android11/out/target/product/v1awifi"
          test -s "$product/system.img"
          python3 scripts/verify_sparse_system.py "$product/system.img" evidence/system-image-validation.json
      - name: Preserve structurally checked development system image
        uses: actions/upload-artifact@v4
        with:
          name: v1awifi-development-system-NOT-FLASH-APPROVED
          path: ${{ runner.temp }}/android11/out/target/product/v1awifi/system.img
          retention-days: 7
          if-no-files-found: error
          compression-level: 1
      - name: Preserve structurally verified development boot image
        uses: actions/upload-artifact@v4
        with:
          name: v1awifi-development-boot-NOT-FLASH-APPROVED
          path: development-boot/
          retention-days: 7
          if-no-files-found: error
      - name: Preserve policy compiler inputs for reproducible diagnosis
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/selinux-inputs evidence/policy-host/bin evidence/policy-host/lib64
          policy_dir="$RUNNER_TEMP/android11/out/target/product/v1awifi/obj/FAKE/sepolicy_neverallows_intermediates"
          for name in policy.conf policy_2.conf; do
            if [ -f "$policy_dir/$name" ]; then
              cp "$policy_dir/$name" evidence/selinux-inputs/
            fi
          done
          host="$RUNNER_TEMP/android11/out/host/linux-x86"
          for name in checkpolicy sepolicy-analyze; do
            if [ -f "$host/bin/$name" ]; then
              cp "$host/bin/$name" evidence/policy-host/bin/
              ldd "$host/bin/$name" > "evidence/policy-host/$name-dependencies.txt" || true
            fi
          done
          for name in libc++.so libc++.so.1; do
            if [ -f "$host/lib64/$name" ]; then
              cp -L "$host/lib64/$name" evidence/policy-host/lib64/
            fi
          done
          if [ -f evidence/selinux/build.log ]; then
            tail -n 100 evidence/selinux/build.log
          fi
      - name: Record final footprint
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          if [ -f evidence/build.log ]; then
            tail -n 100 evidence/build.log
          fi
          df -B1 > evidence/disk-final.txt
          if [ -d "$RUNNER_TEMP/android11/out" ]; then
            timeout 90 du -x -B1 --max-depth=2 "$RUNNER_TEMP/android11/out" > evidence/out-footprint.txt || true
          fi
      - name: Save build probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android11-v1awifi-build-probe-NOT-A-ROM
          path: evidence/
          retention-days: 7
          if-no-files-found: warn

